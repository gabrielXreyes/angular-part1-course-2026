<h1>DragonBall Page</h1>
<hr />

<section class="row">
    <div class="col-12 col-sm-6">
        <dragonball-character-add
        //recibe el evento 'newCharacter' que emite el componente hijo y lo maneja con la función 'addCharacter' del componente padre
        (onNewCharacter)="dragonballService.addCharacter($event)"></dragonball-character-add>
    </div>

    <div class="col-12 col-sm-6">
        <dragonball-character-list 
        [characters]="dragonballService.characters()" 
        listName="lista de personajes"></dragonball-character-list>
    </div>
</section>
