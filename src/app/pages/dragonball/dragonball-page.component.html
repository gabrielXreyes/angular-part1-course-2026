<h1>DragonBall Page</h1>
<hr />

<section class="row">
    <div class="col-12 col-sm-6">
        <h3>Agregar:{{name()}}  {{powerLevel()}}</h3>
        <input 
        type="text" 
        class="form-control" 
        placeholder="Nombre" 
        [value]="name()"
        // cuando el valor del input cambie, se actualiza la señal 'name' con el valor del input
        // (change)="name.set(txtName.value)"

        // otra forma de hacerlo, usando la referencia local del input pero se actualiza en tiempo real, cada vez que el usuario escribe algo
        (input)="name.set(txtName.value)"
        
        //referencias local
        #txtName 
        />
        
        <input 
        type="number" 
        class="form-control mt-2" 
        placeholder="Poder"
        [value]="powerLevel()"
        (input)="powerLevel.set(txtPowerLevel.valueAsNumber)"
        #txtPowerLevel
        />

        <button (click)="addCharacter()" class="mt-2 btn btn-primary">Agregar</button>
    </div>


    <div class="col-12 col-sm-6">
        <h3>Listado</h3>
        <ul>
            @for(character of characters(); track character.id ;let idx = $index)
            {
                @if(character.powerLevel>500){
                    <li>
                    <span>{{idx +1}} - {{character.name}}</span>
                    <strong 
                    [class.text-danger]="character.powerLevel > 9000"
                    [class.text-primary]="character.powerLevel <= 9000"
                    [class.text-success]="character.powerLevel == 6000"
                    /*[ngClass]="powerClasses()" */
                    > ({{character.powerLevel}})</strong>
                    </li>
                }@else{
                    <li>
                        <strong class="text-danger"> aqui no hay nadie </strong>
                    </li>
                }
            }
        </ul>
    </div>
</section>
